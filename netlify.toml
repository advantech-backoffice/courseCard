[build]
  base = "frontend"
  publish = "dist"
  command = "npm install && npm run build"

# Redirect frontend API requests to the backend host.
# Replace the backend URL below with your actual backend deployment URL.
[[redirects]]
  from = "/api/*"
  to = "https://course-card-one.vercel.app/api/:splat"
  status = 200
  force = true
