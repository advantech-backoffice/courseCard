[build]
  base = "frontend"
  publish = "frontend/dist"
  command = "npm install && npm run build"

# Redirect frontend API requests to the backend host.
# Replace the backend URL below with your actual backend deployment URL.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_HOST.com/:splat"
  status = 200
  force = true
